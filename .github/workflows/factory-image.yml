# Builds the factory image (factory/image/Dockerfile) and pushes it to GHCR.
# Jobs use the image named by the FACTORY_IMAGE repository variable. Pin it by digest and change it on purpose:
# a new image is a change to the factory itself.
name: "Factory: image"

on:
  push:
    branches: [main]
    paths: ["factory/image/**"]
  schedule:
    - cron: "17 3 * * 1" # Mondays, for OS security fixes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/factory-agent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: factory/image
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest

      - name: Report the digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Factory image built"
            echo
            echo "To use it, set the repository variable \`FACTORY_IMAGE\` to:"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
