# Stop 4, Plan: after a spec or a task merges, start every task whose dependencies have merged.
# Dispatched by the event router; can also be run by hand for a ticket.
name: "Factory: plan (stop 4)"
run-name: "Plan ${{ inputs.key }}"

on:
  workflow_dispatch:
    inputs:
      key:
        description: Jira key, such as SALES-412
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: write # dispatch build runs
  packages: read

concurrency:
  group: factory-plan-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  plan:
    if: vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: factory-agent
    timeout-minutes: 15
    env:
      FACTORY_IMAGE: ${{ vars.FACTORY_IMAGE }}
      FACTORY_DEFAULT_BRANCH: ${{ vars.FACTORY_DEFAULT_BRANCH || 'main' }}
      FX: bash _kit/factory/bin/in-image
      # The control panel's kill switch (factory_kit/switch.py); unused until factory-policy.yml names a landscape.
      SF_FACTORY_USERNAME: ${{ secrets.SF_FACTORY_USERNAME || vars.SF_FACTORY_USERNAME }}
      SF_FACTORY_CLIENT_ID: ${{ secrets.SF_FACTORY_CLIENT_ID || vars.SF_FACTORY_CLIENT_ID }}
      SF_FACTORY_URL: ${{ vars.SF_FACTORY_URL }}
      KEY: ${{ inputs.key }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL || vars.JIRA_BASE_URL }}
      JIRA_USER: ${{ secrets.JIRA_USER || vars.JIRA_USER }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Check the key
        run: '[[ "$KEY" =~ ^[A-Z][A-Z0-9_]*-[1-9][0-9]*$ ]] || { echo "::error::Not a Jira key: $KEY"; exit 1; }'

      - name: Check out the factory kit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ vars.FACTORY_DEFAULT_BRANCH || 'main' }}
          path: _kit
          persist-credentials: false
          sparse-checkout: |
            factory

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the factory image
        run: docker pull "$FACTORY_IMAGE"

      - name: Start the tasks that are ready
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SF_FACTORY_JWT_KEY: ${{ secrets.SF_FACTORY_JWT_KEY }}
        run: $FX -e JIRA_API_TOKEN -e GH_TOKEN -e SF_FACTORY_JWT_KEY -- factory plan --key "$KEY"
