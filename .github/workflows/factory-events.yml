# Event router: connects pull request events to the factory without giving them secrets.
#   spec or task merged                  -> plan (stop 4)
#   changes requested on a factory PR    -> spec revise (Gate 1) or build revise (Gate 2)
#   validate failed on a build PR        -> build fix (stop 6 loop; the build job enforces the budget)
#   validate passed on a build PR        -> reviewer agent
#   "/factory <question>" on a spec PR   -> spec discuss: the agent answers, and may ask back
#   "/factory revise" on a spec PR       -> spec revise, with the conversation so far
# It only dispatches workflows on the default branch, where the factory-agent environment allows secrets.
name: "Factory: events"

on:
  pull_request:
    types: [closed]
    branches: [main, "poc/**"]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: ["Factory: validate (stop 6)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write # read pull requests; react to /factory comments on lines
  issues: write # react to /factory comments in the conversation
  actions: write # dispatch factory runs
  packages: read

jobs:
  route:
    # Comments only matter when they start with /factory; the router also checks the author's access.
    if: >-
      vars.FACTORY_ENABLED == 'true' &&
      ((github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment') ||
       startsWith(github.event.comment.body, '/factory'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FACTORY_IMAGE: ${{ vars.FACTORY_IMAGE }}
      FACTORY_DEFAULT_BRANCH: ${{ vars.FACTORY_DEFAULT_BRANCH || 'main' }}
      FX: bash _kit/factory/bin/in-image
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Check out the factory kit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ vars.FACTORY_DEFAULT_BRANCH || 'main' }}
          path: _kit
          persist-credentials: false
          sparse-checkout: |
            factory

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the factory image
        run: docker pull "$FACTORY_IMAGE"

      - name: Dispatch factory runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: $FX -e GH_TOKEN -- factory route
