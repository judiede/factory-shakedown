# Proposes version updates for the factory's pinned dependencies. Each update is a reviewed pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14 # only versions at least two weeks old
  - package-ecosystem: docker
    directory: /factory/image
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Moving Node.js to its next LTS major is a deliberate change, not an automatic one.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
